---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-admin-binding
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: default
  namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}-jenkins
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-jenkins
    spec:
      containers:
        - name: jenkins
          image: {{ .Values.jenkins.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-jenkins-secret
                  key: password
          resources:
            requests:
              cpu: {{ .Values.jenkins.resources.requests.cpu }}
              memory: {{ .Values.jenkins.resources.requests.memory }}
          ports:
            - name: http-port
              containerPort: 8080
            - name: jnlp-port
              containerPort: 50000
          volumeMounts:
            - name: jenkins-auth-config
              mountPath: /var/jenkins_home/init.groovy.d/basic-security.groovy
              subPath: basic-security.groovy
            - name: jenkins-config-yaml
              mountPath: /var/jenkins_home/casc_configs/jenkins.yaml
              subPath: jenkins.yaml
            - name: jenkins-config
              mountPath: /var/jenkins_home
      volumes:
        - name: jenkins-auth-config
          configMap:
            name: basic-security
        - name: jenkins-config-yaml
          configMap:
            name: {{ .Release.Name }}-jenkins-config
        - name: jenkins-config
          nfs:
            server: {{ .Values.jenkins.nfs.server }}
            path: {{ .Values.jenkins.nfs.path }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-jenkins-config
  namespace: {{ .Release.Namespace }}
data:
  jenkins.yaml: |
        jenkins:
          numExecutors: {{ .Values.jenkins.casc.numExecutors }}
          clouds:
          - kubernetes:
              containerCapStr: "10"
              maxRequestsPerHostStr: "32"
              jenkinsUrl: "http://{{ .Release.Name }}-jenkins:8080"
              name: "kubernetes"
              namespace: "{{ .Release.Namespace }}"
              skipTlsVerify: true
        credentials:
          system:
            domainCredentials:
            - credentials:
              - usernamePassword:
                  description: "Githubuser"
                  id: "some_randome"
                  password: "XXXXXXXXXXX"
                  scope: GLOBAL
                  username: "git_hub_user"
        unclassified:
          location:
            adminAddress: {{ .Values.jenkins.casc.adminEmail }}
            url: "http://jenkins.{{ .Values.global.domain }}/"
          shell:
            shell: "/bin/bash"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: basic-security
  namespace: {{ .Release.Namespace }}
data:
  basic-security.groovy: |
    #!groovy
    import jenkins.model.*
    import hudson.security.*
    def instance = Jenkins.getInstance()
    println "--> creating local user 'admin'"
    def password = System.getenv("PASS")
    def hudsonRealm = new HudsonPrivateSecurityRealm(false)
    hudsonRealm.createAccount('admin', password)
    instance.setSecurityRealm(hudsonRealm)
    def strategy = new FullControlOnceLoggedInAuthorizationStrategy()
    strategy.setAllowAnonymousRead(true)
    instance.setAuthorizationStrategy(strategy)
    instance.save()
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-jenkins-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  password: {{ .Values.jenkins.adminPassword | b64enc | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-jenkins
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: master
      port: {{ .Values.jenkins.service.port }}
      targetPort: 8080
  selector:
    app: {{ .Release.Name }}-jenkins
---
